name: Verify research tooling
on: [push, pull_request, workflow_dispatch]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python analysis/risk_analysis.py --output results/local/risk_analysis.json
      - run: g++ -std=c++11 -Wall -Wextra -Werror tests/test_firmware_logic.cpp -o /tmp/aya_logic && /tmp/aya_logic
